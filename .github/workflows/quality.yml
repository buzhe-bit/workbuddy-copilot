name: Quality baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-server-core:
    name: Linux server/core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Enforce release Python contract
        run: python scripts/python_preflight.py
      - name: Install lane dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-server.txt -r requirements-core.txt -r requirements-dev.txt
      - name: Run server/core quality gate
        shell: bash
        run: |
          set +e
          python -m pytest tests \
            --ignore=tests/e2e \
            --ignore=tests/test_e2e_reverse_message.py \
            --ignore=tests/test_floating_native_phase3.py \
            -m "not real_machine" \
            --cov --cov-report=term --cov-report=json:coverage.json \
            --cov-fail-under=80 -q > pytest-output.txt 2>&1
          status=$?
          set -e
          cat pytest-output.txt
          python scripts/quality_summary.py \
            --pytest-output pytest-output.txt \
            --output quality-summary.json \
            --pytest-exit-code "$status"
          exit "$status"
      - name: Upload machine-readable summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-linux-server-core
          path: |
            pytest-output.txt
            quality-summary.json
            coverage.json

  macos-client-browser:
    name: macOS client/browser (real Chromium)
    runs-on: macos-latest
    env:
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Configure Playwright cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - name: Enforce release Python contract
        run: python scripts/python_preflight.py
      - name: Install lane dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-server.txt -r requirements-macos.txt -r requirements-dev.txt
          python -m playwright install chromium
      - name: Prove Chromium launches
        run: |
          python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(); page = b.new_page(); assert page.evaluate("1 + 1") == 2; b.close(); p.stop()'
      - name: Run client/browser quality gate
        shell: bash
        run: |
          set +e
          python -m pytest \
            tests/test_platform_imports.py \
            tests/e2e/test_mentor_ui.py \
            tests/e2e/test_student_agent_system.py \
            -q > pytest-output.txt 2>&1
          status=$?
          set -e
          cat pytest-output.txt
          python scripts/quality_summary.py \
            --pytest-output pytest-output.txt \
            --output quality-summary.json \
            --pytest-exit-code "$status"
          exit "$status"
      - name: Upload machine-readable summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-macos-client-browser
          path: |
            pytest-output.txt
            quality-summary.json

  windows-hosted:
    name: Windows hosted runtime (W1 release still BLOCKED)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Enforce release Python contract
        run: python scripts/python_preflight.py
      - name: Install hosted runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt -r requirements-windows.txt -r requirements-server.txt -r requirements-dev.txt
      - name: Parse PowerShell lifecycle and evidence scripts
        shell: pwsh
        run: |
          $scripts = @(
            'install_windows.ps1',
            'uninstall_windows.ps1',
            'probe_windows_workbuddy.ps1',
            'run_windows_w1.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw "$script`n$($errors | Out-String)" }
          }
      - name: Prove production wheel carries the evidence schema
        shell: pwsh
        run: |
          python -m pip wheel . --no-deps --wheel-dir wheelhouse
          @'
          import glob
          import zipfile

          wheels = glob.glob("wheelhouse/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          assert "copilot/student_platform/windows_evidence.schema.json" in names, sorted(names)
          '@ | python -
      - name: Run Windows hosted runtime gate
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python -m pytest `
            tests/test_platform_imports.py `
            tests/test_windows_adapter.py `
            tests/test_windows_install_contract.py `
            tests/test_windows_runtime_config.py `
            tests/test_windows_installer_lifecycle.py `
            tests/test_windows_evidence.py `
            tests/test_windows_w1_real_machine.py `
            tests/test_floating_windows.py `
            tests/test_windows_liveness.py `
            tests/test_windows_runtime.py `
            tests/test_windows_workbuddy_integration.py `
            tests/test_student_ask_idempotency.py `
            tests/test_hook_subprocess.py `
            tests/component/test_windows_student_runtime.py `
            tests/component/test_windows_client_runtime.py `
            -m "windows and not real_machine" `
            -q *> pytest-output.txt
          $windowsStatus = $LASTEXITCODE
          Get-Content pytest-output.txt
          python scripts/quality_summary.py `
            --pytest-output pytest-output.txt `
            --output quality-summary.json `
            --pytest-exit-code $windowsStatus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m pytest `
            tests/test_student_spool.py `
            tests/test_student_transport.py `
            tests/test_student_coordinator.py `
            tests/test_student_agent.py `
            tests/test_app_context.py `
            tests/test_transcript_upload_api.py `
            tests/test_wb_upload.py `
            tests/test_hook.py `
            tests/test_server_redlines.py `
            tests/test_store_phase1.py `
            -q *> core-pytest-output.txt
          $coreStatus = $LASTEXITCODE
          Get-Content core-pytest-output.txt
          python scripts/quality_summary.py `
            --pytest-output core-pytest-output.txt `
            --output core-quality-summary.json `
            --pytest-exit-code $coreStatus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($windowsStatus -ne 0) { exit $windowsStatus }
          exit $coreStatus
      - name: Upload machine-readable summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-windows-hosted-runtime
          path: |
            pytest-output.txt
            quality-summary.json
            core-pytest-output.txt
            core-quality-summary.json

  windows-w1-evidence:
    name: Windows W1 evidence gate (BLOCKED without real machine)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Derive the hosted W1 gate status with the production validator
        shell: pwsh
        run: |
          $validationOutput = & python scripts/validate_windows_evidence.py `
            --evidence missing-real-machine-evidence.json `
            --schema copilot/student_platform/windows_evidence.schema.json `
            --expected-commit $env:GITHUB_SHA `
            --expected-build "hosted-$env:GITHUB_RUN_ID" `
            --expected-runner-id "untrusted-hosted-$env:GITHUB_RUN_ID" `
            --hosted-ci
          $validationStatus = $LASTEXITCODE
          $validationText = ($validationOutput | Out-String).Trim()
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'w1-evidence.json'),
            $validationText + [Environment]::NewLine,
            (New-Object System.Text.UTF8Encoding($false))
          )
          if ($validationStatus -ne 2) {
            throw "missing W1 evidence must return the blocked exit code; got $validationStatus"
          }
          $validation = $validationText | ConvertFrom-Json
          if ($validation.status -ne 'blocked' -or $validation.rollout_ready -ne $false) {
            throw 'hosted W1 status was not derived as blocked'
          }
          Write-Host "::warning::BLOCKED: Windows W0/W1 real-machine evidence is still missing. Hosted green is only an implementation candidate."
          exit 0
      - name: Upload W1 gate status
        uses: actions/upload-artifact@v4
        with:
          name: windows-w1-evidence-blocked
          path: w1-evidence.json
