[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbuddy-copilot"
version = "0.0.0"
description = "WorkBuddy learning copilot"
requires-python = ">=3.13,<3.14"

[tool.setuptools.packages.find]
include = ["copilot*"]
exclude = ["tests*", "legacy*"]
